name: Refresh profile stats

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:             # run manually from the Actions tab
  push:
    paths:
      - "scripts/generate_stats.py"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats and heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-heatmap.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
